name: toke_plus
description: "Toke+ - Conecta clientes con tecnicos de servicios"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^15.1.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI / Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  iconsax_flutter: ^1.0.0+1
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  app_links: ^6.4.0
  crypto: ^3.0.3

  # Adaptive Layout
  flutter_adaptive_scaffold: ^0.3.1
  image_picker: ^1.2.2
  share_plus: ^13.1.0
  screenshot: ^3.0.0
  path_provider: ^2.1.5
  geolocator: ^13.0.2
  socket_io_client: ^3.1.2
  webview_flutter: ^4.10.0
  intl: ^0.20.3

  # Push Notifications (Firebase)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/
    - assets/images/onboarding/
    - assets/images/onboarding/2.0x/
    - assets/images/onboarding/3.0x/
    - assets/images/how_it_works/
    - assets/icons/
    - assets/animations/
