name: toke_plus
description: "Toke+ - Conecta clientes con tecnicos de servicios"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^15.1.2

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI / Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  smooth_page_indicator: ^1.2.0+3
  iconsax_flutter: ^1.0.0+1
  cupertino_icons: ^1.0.8

  # Adaptive Layout
  flutter_adaptive_scaffold: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/2.0x/
    - assets/images/3.0x/
    - assets/images/onboarding/
    - assets/images/onboarding/2.0x/
    - assets/images/onboarding/3.0x/
    - assets/icons/
    - assets/animations/
