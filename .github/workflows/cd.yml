name: CD

on:
  push:
    branches: [main]

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v5

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v5
        with:
          name: toke-plus-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Resumen del build
        run: |
          APK_SIZE=$(wc -c < build/app/outputs/flutter-apk/app-debug.apk)
          echo "### Build exitoso" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tamaño APK:** $(echo "$APK_SIZE / 1024 / 1024" | bc) MB" >> $GITHUB_STEP_SUMMARY
          echo "- **Artefacto:** toke-plus-debug-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
