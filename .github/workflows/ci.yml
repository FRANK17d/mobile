name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Análisis y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.5"
          channel: stable
          cache: true

      - name: Obtener dependencias
        run: flutter pub get

      - name: Verificar formato de código
        run: dart format --output=none --set-exit-if-changed lib/

      - name: Análisis estático
        run: flutter analyze --fatal-infos

      - name: Ejecutar pruebas
        run: flutter test --coverage

      - name: Verificar tamaño de assets
        run: |
          TOTAL=$(find assets/ -type f | xargs wc -c 2>/dev/null | tail -1 | awk '{print $1}')
          LIMIT=5242880  # 5 MB
          echo "Peso total de assets: $TOTAL bytes"
          if [ "$TOTAL" -gt "$LIMIT" ]; then
            echo "❌ Assets superan el límite de 5 MB ($TOTAL bytes)"
            exit 1
          fi
          echo "✅ Assets dentro del límite ($TOTAL bytes)"
